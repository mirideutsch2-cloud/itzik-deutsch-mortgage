<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{--red:#D9353B;--redd:#B8232A;--navy:#181842;--mute:#8F90CC}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0B0B24}
body{font-family:'IBM Plex Sans Hebrew',sans-serif;color:#fff;position:relative}
#bg{position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 45%,#1B1B4A 0%,#111134 55%,#0A0A22 100%)}
#grid{position:absolute;inset:-120px;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:60px 60px;-webkit-mask-image:radial-gradient(60% 50% at 50% 50%,#000 30%,transparent 100%)}
#cam{position:absolute;inset:0;perspective:1700px;perspective-origin:500px 1120px;overflow:hidden}
#world{position:absolute;left:0;top:0;width:1px;height:1px;transform-style:preserve-3d}
.obj{position:absolute;left:0;top:0;transform-style:preserve-3d}
.card{position:absolute;border-radius:34px;background:linear-gradient(160deg,#25265E 0%,#18183F 100%);border:1.5px solid rgba(255,255,255,.09);box-shadow:0 70px 120px rgba(0,0,0,.55),0 0 0 1px rgba(0,0,0,.2);transform-style:preserve-3d}
.pop{position:absolute;transform:translateZ(70px)}
.lbl{font-size:30px;color:rgba(255,255,255,.55)}
.r{color:var(--red)}
/* headline */
#hl{position:absolute;top:250px;right:100px;left:100px;height:420px}
.ph{position:absolute;inset:0;text-align:right}
.ln{display:block;white-space:nowrap;line-height:1.08}
.w{position:relative;display:inline-block;margin-left:.24em}
.w .o{color:transparent;-webkit-text-stroke:2px rgba(255,255,255,.28)}
.w .f{position:absolute;right:0;top:0;color:#fff;white-space:nowrap}
.w.k .f{color:var(--red)}
.w .ul{position:absolute;right:0;bottom:.02em;height:.07em;background:var(--red);border-radius:4px}
.w .st{position:absolute;right:-.05em;top:52%;height:.08em;background:var(--red);border-radius:4px}
/* sprites */
.sp{position:absolute;left:0;top:0}
.dm{width:34px;height:34px;border-radius:8px;transform:rotate(45deg)}
/* misc */
.row{display:flex;justify-content:space-between;align-items:center;padding:0 46px;height:92px;border-top:1px solid rgba(255,255,255,.07);font-size:34px}
.row b{font-weight:700;font-size:40px;direction:ltr}
.btn{position:absolute;border-radius:20px;font-weight:700;display:flex;align-items:center;justify-content:center}
.cursor{position:absolute;width:64px;height:64px}
.tile{position:relative;aspect-ratio:1;border-radius:16px;background:#26275A;border:1px solid rgba(255,255,255,.06)}
.bub{position:absolute;border-radius:26px;padding:20px 30px;font-size:36px;line-height:1.25;white-space:nowrap}
.ltr{direction:ltr;unicode-bidi:isolate}
</style></head><body>
<div id="bg"></div><div id="grid"></div>
<div id="cam"><div id="world"></div></div>
<div id="hl"></div>
<script>
// ---------------- helpers
const $=(h)=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild};
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lin=(t,a,b)=>cl((t-a)/(b-a));
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eo=x=>1-Math.pow(1-x,3);
const eob=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const mix=(a,b,p)=>a+(b-a)*p;
const BPM=92, BEAT=60/BPM;
const beat=t=>Math.pow(1-((t%BEAT)/BEAT),4);
const PHOTO=window.PHOTO||null;
const world=document.getElementById('world');

// ---------------- karaoke phrases (real VO times)
const PH=[
 {a:0,b:3.22,lines:[{s:44,ws:[['בבנק',.2],['יש',.74],['מישהו',1.0],['שדואג',1.44],['לבנק.',1.82]],dim:1},{s:134,ws:[['ומי',2.28],['דואג',2.5],['לכם?',2.72,'k']]}]},
 {a:3.22,b:5.42,lines:[{s:44,ws:[['משכנתא',3.3],['ל-30',3.74],['שנה,',4.0]],dim:1},{s:118,ws:[['על',4.46],['סמך',4.56]]},{s:118,ws:[['הצעה',4.82],['אחת?',5.16,'k']]}]},
 {a:5.42,b:7.52,lines:[{s:44,ws:[['זה',5.52],['כמו',5.68]],dim:1},{s:126,ws:[['לסובב',5.84]]},{s:126,ws:[['רולטה',6.18,'k']]},{s:44,ws:[['ולקוות',6.6],['לטוב...',7.04]],dim:1}]},
 {a:7.52,b:10.52,lines:[{s:44,ws:[['אני',7.65]],dim:1},{s:128,ws:[['איציק',7.81],['דייטש',8.07,'u']]},{s:56,ws:[['יושב',8.71],['בצד',9.01],['שלכם',9.39,'k'],['של',9.81],['השולחן',10.01]]}]},
 {a:10.52,b:13.4,lines:[{s:118,ws:[['מנתח!',10.68],['מתמקח!',11.38]]},{s:118,ws:[['ומלווה',12.04]]},{s:72,ws:[['עד',12.58],['החתימה!',12.88,'k']]}]},
 {a:13.4,b:15.98,lines:[{s:72,ws:[['הבנק',13.5],['תמיד',13.82],['מרוויח.',14.08,'s']]},{s:134,ws:[['הפעם,',14.7]]},{s:134,ws:[['גם',15.24,'k'],['אתם.',15.4,'k']]}]},
 {a:15.98,b:19.45,lines:[{s:44,ws:[['שלחו',16.1],['לי',16.44]],dim:1},{s:134,ws:[['"שולחן"',16.58,'k']]},{s:56,ws:[['בוואטסאפ,',17.2],['ואני',17.74],['חוזר',17.98],['אליכם',18.26],['עוד',18.64],['היום!',18.88]]}]},
];
const hl=document.getElementById('hl');
PH.forEach(p=>{p.el=$('<div class="ph"></div>');hl.appendChild(p.el);p.W=[];
 p.lines.forEach((L,li)=>{const ln=$(`<div class="ln" style="font-size:${L.s}px;font-weight:${L.s>60?700:400};margin-bottom:${L.s>60?4:14}px"></div>`);
  if(L.dim)ln.style.opacity=.9;
  L.ws.forEach(([txt,t,k])=>{const w=$(`<span class="w ${k=='k'?'k':''}"><span class="o">${txt}</span><span class="f">${txt}</span></span>`);
   let deco=null;if(k=='u'){deco=$('<span class="ul"></span>');w.appendChild(deco)}if(k=='s'){deco=$('<span class="st"></span>');w.appendChild(deco)}
   ln.appendChild(w);p.W.push({w,f:w.querySelector('.f'),o:w.querySelector('.o'),t,k,deco,small:L.s<60})});
  p.el.appendChild(ln)})});
function drawHL(t){
 PH.forEach((p,i)=>{
  const vis=t>=p.a-0.001&&t<p.b+0.18;p.el.style.display=vis?'block':'none';if(!vis)return;
  const inP=i==0?1:eo(lin(t,p.a,p.a+.22)), outP=eio(lin(t,p.b-.04,p.b+.16));
  p.el.style.opacity=inP*(1-outP);p.el.style.transform=`translateY(${(1-inP)*40-outP*50}px)`;
  p.W.forEach(W=>{let q=lin(t,W.t-.02,W.t+.13);if(i==0&&t<0.15)q=1;
   W.f.style.clipPath=`inset(-10% 0 -10% ${(1-q)*100}%)`;
   if(W.small){W.f.style.color=W.k=='k'?'#D9353B':'rgba(255,255,255,.82)';W.o.style.webkitTextStroke='1.5px rgba(255,255,255,.25)'}
   const pop=W.k=='k'?1+0.12*Math.sin(Math.PI*lin(t,W.t,W.t+.3)):1;W.w.style.transform=`scale(${pop})`;
   if(W.deco){const d=W.k=='u'?lin(t,W.t+.25,W.t+.6):lin(t,14.62,14.95);W.deco.style.width=(eo(d)*104)+'%'}
  })});
}

// ---------------- world objects
const OBJ=[];
function obj(x,y,z,html,opt={}){const e=$(`<div class="obj">${html}</div>`);world.appendChild(e);const o={x,y,z,e,...opt};OBJ.push(o);return o}
// shot positions (world coords of card centres)
const P={g:[0,0,0],offer:[1500,-320,-150],wheel:[2950,220,0],prof:[4400,-240,-200],route:[5850,280,0],label:[7300,-120,-150],chat:[8750,220,0],end:[10200,0,0]};

</div>`);

const SEG=['פריים','קבועה','משתנה','צמודה','פריים','קבועה','משתנה','צמודה'];
let ws='';SEG.forEach((s,i)=>{const a0=i*45-90,a1=a0+45,R=300,rad=d=>d*Math.PI/180;
 const p=`M0 0 L${R*Math.cos(rad(a0))} ${R*Math.sin(rad(a0))} A${R} ${R} 0 0 1 ${R*Math.cos(rad(a1))} ${R*Math.sin(rad(a1))} Z`;
 const am=a0+22.5;ws+=`<path d="${p}" fill="${i==3?'#D9353B':(i%2?'#26275E':'#33347A')}" stroke="#14143A" stroke-width="4"/><text transform="rotate(${am}) translate(185 0) rotate(90)" text-anchor="middle" dominant-baseline="middle" fill="#fff" font-size="34" font-weight="700" font-family="IBM Plex Sans Hebrew">${s}</text>`});
const WH=obj(...P.wheel,`<div class="card" style="left:-380px;top:-420px;width:760px;height:840px">

</div>`);

const photoHTML=PHOTO?`<img src="${PHOTO}" style="width:100%;height:100%;object-fit:cover;object-position:50% 25%">`:`<div style="width:100%;height:100%;background:linear-gradient(160deg,#3A3B78,#20214F);display:flex;align-items:flex-end;justify-content:center"><svg width="300" height="330" viewBox="0 0 300 330"><circle cx="150" cy="120" r="78" fill="#55578F"/><path d="M20 330 C30 220 90 200 150 200 C210 200 270 220 280 330 Z" fill="#55578F"/></svg></div>`;
const PR=obj(...P.prof,`<div class="card" style="left:-370px;top:-420px;width:740px;height:840px">
 <div style="position:absolute;left:40px;top:40px;width:660px;height:520px;border-radius:24px;overflow:hidden">${photoHTML}</div>

  <div style="position:absolute;right:34px;top:20px;font-size:30px;font-weight:700">אתם</div><div style="position:absolute;left:34px;top:20px;font-size:30px;color:rgba(255,255,255,.45)">הבנק</div>
  <div id="chip" style="position:absolute;top:8px;width:150px;height:64px;border-radius:32px;background:var(--red);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:700">איציק</div>
 </div>
 <div class="pop" id="side" style="left:-70px;top:520px;background:#fff;color:#181842;border-radius:22px;padding:16px 26px;font-size:34px;font-weight:700;display:flex;gap:12px;align-items:center;box-shadow:0 20px 40px rgba(0,0,0,.35)"><svg width="36" height="36"><circle cx="18" cy="18" r="18" fill="#D9353B"/><path d="M10 18 L16 24 L27 12" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/></svg>בצד שלכם</div>
</div>`);

// S5 route (no card background — line on dark, like ref)
const RT=obj(...P.route,`<div style="position:absolute;left:-380px;top:-430px;width:760px;height:860px">
 <svg width="760" height="860" viewBox="0 0 760 860" style="overflow:visible">
  <path d="M480 840 V40" stroke="rgba(255,255,255,.22)" stroke-width="5" stroke-dasharray="12 16" fill="none"/>

 <div style="display:flex;justify-content:space-between;align-items:center;padding:34px 40px 0"><div style="font-size:30px;font-weight:700;letter-spacing:.5px">איציק דייטש</div><div style="font-size:22px;color:#55577A" class="ltr">FILE / 0536</div></div>

const CH=obj(...P.chat,`<div class="card" style="left:-370px;top:-450px;width:740px;height:900px;background:linear-gradient(180deg,#1E1F52,#17173F);overflow:hidden">
 <div style="height:120px;background:#202A5A;display:flex;align-items:center;gap:20px;padding:0 34px;border-bottom:1px solid rgba(255,255,255,.08)">

  <svg width="44" height="44" viewBox="0 0 32 32" style="margin-right:auto"><path fill="#25D366" d="M16 3C8.8 3 3 8.6 3 15.6c0 2.5.7 4.8 2 6.8L3.6 29l6.8-1.8c1.8 1 3.9 1.6 6 1.6 7.2 0 13-5.6 13-12.6S23.2 3 16 3z"/><path fill="#fff" d="M12 9.5c-.3-.6-.6-.6-.9-.6h-.8c-.3 0-.7.1-1 .5-.4.4-1.3 1.3-1.3 3.1s1.3 3.6 1.5 3.9c.2.2 2.6 4.1 6.4 5.6 3.2 1.2 3.8 1 4.5.9.7-.1 2.2-.9 2.5-1.8.3-.9.3-1.6.2-1.8-.1-.2-.3-.3-.7-.5l-2.4-1.1c-.3-.1-.6-.2-.8.2-.2.4-.9 1.2-1.1 1.4-.2.2-.4.3-.8.1-.4-.2-1.6-.6-3-1.9-1.1-1-1.9-2.2-2.1-2.6-.2-.4 0-.6.2-.8l.6-.7c.2-.2.3-.4.4-.7.1-.3.1-.5 0-.7l-1.4-2.5z"/></svg>
 </div>
 <div id="b1" class="bub" style="left:34px;top:200px;background:#2A2C66;border-bottom-left-radius:6px">היי! איך אפשר לעזור?</div>
