<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0A0A1C}
body{font-family:'IBM Plex Sans Hebrew',sans-serif;color:#fff;position:relative}
canvas{position:absolute;inset:0}
#cap{position:absolute;top:290px;right:96px;width:820px;text-align:right;font-size:56px;font-weight:400;line-height:1.25;letter-spacing:.2px}
#cap .w{display:inline-block;margin-left:.26em;white-space:nowrap}
#cap .k{color:#E0393F;font-weight:700}
#cap .b{font-weight:700}
</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<div id="cap"></div>
<script>
const W=1080,H=1920,CX=540,CY=1000;
const RED='#D9353B',BG='#0A0A1C';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lin=(t,a,b)=>cl((t-a)/(b-a));
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eo=x=>1-Math.pow(1-x,3);
const ei=x=>x*x*x;
const mix=(a,b,p)=>a+(b-a)*p;
const emix=(a,b,p)=>a*Math.pow(b/a,p); // exponential zoom
const D=Math.PI/180;
const hash=(i,j)=>{const x=Math.sin(i*127.1+j*311.7)*43758.5453;return x-Math.floor(x)};
const F="'IBM Plex Sans Hebrew'";
function img(src){const i=new Image();i.src=src;return i}
const IA=img('img/a.jpg'),IB=img('img/b.jpg'),IC=img('img/c.jpg'),LOGO=img('img/logo-light.png');
const IP=window.PHOTO?img(window.PHOTO):null;

// ============ captions (DOM, word-timed, no exclamation marks)
const CAPS=[
 {a:.2,b:2.2,ws:[['בבנק',.2],['יש',.74],['מישהו',1.0],['שדואג',1.44],['לבנק.',1.82]]},
 {a:2.24,b:3.22,ws:[['ומי',2.28],['דואג',2.5],['לכם?',2.72,'k']]},
 {a:3.28,b:5.46,ws:[['משכנתא',3.3],['ל-30',3.74],['שנה,',4.0],['על',4.46],['סמך',4.56],['הצעה',4.82],['אחת?',5.16,'k']]},
 {a:5.5,b:7.5,ws:[['זה',5.52],['כמו',5.68],['לסובב',5.84],['רולטה',6.18,'k'],['ולקוות',6.6],['לטוב.',7.04]]},
 {a:7.6,b:8.62,ws:[['אני',7.65],['איציק',7.81,'b'],['דייטש.',8.07,'b']]},
 {a:8.66,b:10.5,ws:[['יושב',8.71],['בצד',9.01],['שלכם',9.39,'k'],['של',9.81],['השולחן.',10.01]]},
 {a:10.62,b:11.34,ws:[['מנתח.',10.68]]},
 {a:11.34,b:12.0,ws:[['מתמקח.',11.38]]},
 {a:12.0,b:13.4,ws:[['ומלווה',12.04],['עד',12.58],['החתימה.',12.88,'k']]},
 {a:13.45,b:14.66,ws:[['הבנק',13.5],['תמיד',13.82],['מרוויח.',14.08]]},
 {a:14.66,b:16.0,ws:[['הפעם,',14.7],['גם',15.24,'k'],['אתם.',15.4,'k']]},
 {a:16.05,b:17.7,ws:[['שלחו',16.1],['לי',16.44],['"שולחן"',16.58,'k'],['בוואטסאפ',17.2]]},
 {a:17.7,b:18.95,ws:[['ואני',17.74],['חוזר',17.98],['אליכם',18.26],['עוד',18.64],['היום.',18.88]]},
];
const capEl=document.getElementById('cap');
CAPS.forEach(c=>{c.el=document.createElement('div');c.el.style.position='absolute';c.el.style.right='0';c.el.style.top='0';c.el.style.width='820px';
 c.W=c.ws.map(([s,t,k])=>{const sp=document.createElement('span');sp.className='w'+(k?' '+k:'');sp.textContent=s;c.el.appendChild(sp);return {sp,t}});capEl.appendChild(c.el)});
const COVER=document.createElement('div');COVER.innerHTML='<div style="font-size:46px;color:rgba(255,255,255,.7);margin-bottom:16px">בבנק יש מישהו שדואג לבנק.</div><div style="font-size:132px;font-weight:700;line-height:1.02">ומי דואג<br><span style="color:#E0393F">לכם?</span></div>';
COVER.style.cssText='position:absolute;right:0;top:0;width:820px';capEl.appendChild(COVER);
function drawCaps(t){
 const cover=t<0.12;COVER.style.display=cover?'block':'none';
 CAPS.forEach(c=>{const on=!cover&&t>=c.a-0.05&&t<c.b;c.el.style.display=on?'block':'none';if(!on)return;
  const out=lin(t,c.b-.1,c.b);c.el.style.opacity=1-out;
  c.W.forEach(w=>{const q=eo(lin(t,w.t-.03,w.t+.14));w.sp.style.opacity=q;w.sp.style.transform=`translateY(${(1-q)*14}px)`});});
}

// ============ generic helpers
function brackets(x,y,w,h,a=1,lw=5){if(a<=0)return;ctx.save();ctx.globalAlpha=a;ctx.strokeStyle='#fff';ctx.lineWidth=lw;ctx.lineCap='square';
 const L=Math.min(w,h)*.24;
 [[x,y,1,1],[x+w,y,-1,1],[x,y+h,1,-1],[x+w,y+h,-1,-1]].forEach(([px,py,sx,sy])=>{ctx.beginPath();ctx.moveTo(px,py+sy*L);ctx.lineTo(px,py);ctx.lineTo(px+sx*L,py);ctx.stroke()});ctx.restore()}
function bg(){ctx.fillStyle=BG;ctx.fillRect(0,0,W,H);const g=ctx.createRadialGradient(CX,CY,100,CX,CY,1200);g.addColorStop(0,'rgba(40,40,100,.35)');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
// photo-space camera: point (fx,fy) of a photo lands on screen (CX,CY) at scale s, rotation r
function camApply(fx,fy,s,r){ctx.translate(CX,CY);ctx.rotate(r*D);ctx.scale(s,s);ctx.translate(-fx,-fy)}

// ============ S1 grid + S2 photo A (shared photo-space; target roof = cell 0,0 at (378,640))
const TX=378,TY=640,PX=109,PY=195,RW=82,RH=123;
const SCAN=[[4,-3],[-3,2],[2,4],[-4,-1],[3,1]];
function roul(){const pts=[];let t=5.55,dt=.3;let k=0;while(t<6.9){pts.push([t,[Math.round((hash(k,3)-.5)*8),Math.round((hash(k,7)-.5)*7)]]);t+=dt;dt*=.82;k++}pts.push([6.92,[0,0]]);return pts}
const ROUL=roul();
function bracketCell(t){
 if(t<0.12)return [0,0];
 if(t<5.55){const seg=Math.floor(t/1.1),p=eio(lin(t%1.1,0,.55));const a=SCAN[seg%SCAN.length],b=SCAN[(seg+1)%SCAN.length];
  if(t>4.4){const p2=eio(lin(t,4.4,5.4));const last=[mix(a[0],b[0],p),mix(a[1],b[1],p)];return last}
  return [mix(a[0],b[0],p),mix(a[1],b[1],p)]}
 let cur=ROUL[0][1];for(const [tt,c] of ROUL)if(t>=tt)cur=c;return cur}
function camS1(t){
 // returns fx,fy,s,r
 let s,fx,fy,r;
 if(t<5.5){const p=t/5.5;s=mix(.30,.48,eio(p));fx=TX+PX*mix(2.2,.6,p);fy=TY+PY*mix(1.4,.4,p);r=mix(-7,-4,p)}
 else if(t<7.0){const p=eio(lin(t,5.5,7.0));s=mix(.48,1.0,p);fx=TX+PX*mix(.6,0,p);fy=TY+PY*mix(.4,0,p);r=mix(-4,-1,p)}
 else if(t<7.45){const p=eio(lin(t,7.0,7.45));s=mix(1.0,1.75,p);fx=TX;fy=TY;r=mix(-1,0,p)}
 else if(t<8.22){const p=lin(t,7.45,8.22);s=mix(1.75,2.7,eio(p));fx=TX;fy=TY;r=mix(0,9,eio(p))}
 else{const p=lin(t,8.22,8.55);s=emix(2.7,40,ei(p));fx=TX;fy=TY;r=9+p*6}
 return {fx,fy,s,r}}
function drawS1(t){
 const {fx,fy,s,r}=camS1(t);
 bg();ctx.save();camApply(fx,fy,s,r);
 const photoA=lin(t,7.28,7.48);
 if(photoA<1){
  const span=Math.ceil(1300/(s*PX))+2,spanY=Math.ceil(1500/(s*PY))+2;
  const ci=Math.round((fx-TX)/PX),cj=Math.round((fy-TY)/PY);
  for(let i=ci-span;i<=ci+span;i++)for(let j=cj-spanY;j<=cj+spanY;j++){
   const h=hash(i,j);const g=Math.round(44+h*26);
   const pulse=Math.max(0,Math.sin(t*1.6-(i*.35+j*.5)))*6;
   ctx.fillStyle=`rgb(${g+pulse},${g+pulse},${g+10+pulse})`;
   const x=TX+i*PX-RW/2,y=TY+j*PY-RH/2;ctx.fillRect(x,y,RW,RH);
   ctx.fillStyle='rgba(0,0,0,.18)';ctx.fillRect(x,y+RH*.5,RW,RH*.5);
  }
  const red=t<0.12?1:lin(t,6.95,7.1);
  if(red>0){ctx.fillStyle=RED;ctx.globalAlpha=red;ctx.fillRect(TX-RW/2,TY-RH/2,RW,RH);ctx.globalAlpha=1;
   ctx.shadowColor='rgba(217,53,59,.8)';ctx.shadowBlur=40*red;ctx.fillRect(TX-RW/2,TY-RH/2,RW,RH);ctx.shadowBlur=0}
 }
 if(photoA>0&&IA.complete){ctx.globalAlpha=photoA;ctx.drawImage(IA,0,0);ctx.globalAlpha=1}
 ctx.restore();
 // brackets in screen space
 const [bi,bj]=bracketCell(t);
 const bx=TX+bi*PX,by=TY+bj*PY;
 const m=new DOMMatrix().translate(CX,CY).rotate(r).scale(s).translate(-fx,-fy);
 const pt=m.transformPoint(new DOMPoint(bx,by));
 const lock=lin(t,6.92,7.15);const pad=mix(1.5,1.25,eo(lock));
 const bw=RW*s*pad,bh=RH*s*pad;const ba=t<0.12?1:(t<8.2?1:1-lin(t,8.2,8.35));
 ctx.save();ctx.translate(pt.x,pt.y);ctx.rotate(r*D);brackets(-bw/2,-bh/2,bw,bh,ba,Math.max(3,Math.min(6,s*6)));ctx.restore();
}

// ============ S3 portrait  (8.55–9.35) + photo B table (9.2–10.45)
const FOLD={x:375,y:981,w:180,h:250};
function drawPortrait(x,y,w,h){
 ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();
 if(IP&&IP.complete&&IP.naturalWidth){const sc=Math.max(w/IP.naturalWidth,h/IP.naturalHeight);const iw=IP.naturalWidth*sc,ih=IP.naturalHeight*sc;ctx.filter='grayscale(1) contrast(1.08) brightness(.95)';ctx.drawImage(IP,x+(w-iw)/2,y+(h-ih)*.25,iw,ih);ctx.filter='none'}
 else{const g=ctx.createLinearGradient(x,y,x,y+h);g.addColorStop(0,'#3A3B60');g.addColorStop(1,'#1E1F3E');ctx.fillStyle=g;ctx.fillRect(x,y,w,h);
  ctx.fillStyle='#5A5C82';ctx.beginPath();ctx.arc(x+w/2,y+h*.38,w*.17,0,7);ctx.fill();ctx.beginPath();ctx.ellipse(x+w/2,y+h*.95,w*.36,h*.3,0,Math.PI,0);ctx.fill()}
 ctx.restore()}
function drawS3(t){
 bg();
 const FW=630,FH=875;
 if(t<9.25){
  // red full -> shrinks to frame revealing portrait
  const p=eio(lin(t,8.55,8.82));
  const w=mix(W*1.1,FW,p),h=mix(H*1.1,FH,p);
  drawPortrait(CX-FW/2,CY-FH/2,FW,FH);
  // red mask outside frame shrinking, as border
  const bw=mix(Math.max(W,H),12,p);
  ctx.save();ctx.strokeStyle=RED;ctx.lineWidth=bw*2;ctx.strokeRect(CX-w/2-bw,CY-h/2-bw,w+bw*2,h+bw*2);ctx.restore();
  ctx.fillStyle=RED;ctx.globalAlpha=1-lin(t,8.55,8.7);ctx.fillRect(CX-FW/2,CY-FH/2,FW,FH);ctx.globalAlpha=1;
  brackets(CX-FW*.32,CY-FH*.36,FW*.64,FH*.42,lin(t,8.85,8.95)*(1-lin(t,9.15,9.22)),5);
  // portrait fades into red folder
  const f=lin(t,9.12,9.25);if(f>0){ctx.fillStyle=RED;ctx.globalAlpha=f;ctx.fillRect(CX-FW/2,CY-FH/2,FW,FH);ctx.globalAlpha=1}
  return}
 // photo B camera
 let s,fx,fy,r;
 const s0=FW/FOLD.w;
 if(t<9.95){const p=eio(lin(t,9.25,9.95));s=mix(s0,1.42,p);fx=mix(FOLD.x,376,p);fy=mix(FOLD.y,700,p);r=mix(0,-4,p)}
 else{const p=lin(t,9.95,10.45);s=emix(1.42,14,ei(p));fx=mix(376,FOLD.x,eio(p));fy=mix(700,FOLD.y,eio(p));r=mix(-4,0,eio(p))}
 ctx.save();camApply(fx,fy,s,r);ctx.globalAlpha=lin(t,9.25,9.4);if(IB.complete)ctx.drawImage(IB,0,0);ctx.globalAlpha=1;
 // keep folder pure red over the fade
 ctx.fillStyle=RED;ctx.globalAlpha=1-lin(t,9.3,9.45);ctx.fillRect(FOLD.x-FOLD.w/2,FOLD.y-FOLD.h/2,FOLD.w,FOLD.h);ctx.globalAlpha=1;
 ctx.restore();
 const m=new DOMMatrix().translate(CX,CY).rotate(r).scale(s).translate(-fx,-fy);const pt=m.transformPoint(new DOMPoint(FOLD.x,FOLD.y));
 const lk=eo(lin(t,9.39,9.6));const ba=lk*(1-lin(t,10.05,10.2));const pad=mix(1.6,1.18,lk);
 ctx.save();ctx.translate(pt.x,pt.y);ctx.rotate(r*D);brackets(-FOLD.w*s*pad/2,-FOLD.h*s*pad/2,FOLD.w*s*pad,FOLD.h*s*pad,ba,5);ctx.restore();
}

// ============ S4 route line (10.45–13.35)
function buildPath(){const pts=[];const seg=(x0,y0,x1,y1,n=20)=>{for(let i=0;i<=n;i++)pts.push([mix(x0,x1,i/n),mix(y0,y1,i/n)])};
 const bez=(p0,p1,p2,p3,n=30)=>{for(let i=0;i<=n;i++){const u=i/n,a=(1-u)**3,b=3*u*(1-u)**2,c=3*u*u*(1-u),d=u**3;pts.push([a*p0[0]+b*p1[0]+c*p2[0]+d*p3[0],a*p0[1]+b*p1[1]+c*p2[1]+d*p3[1]])}};
 seg(540,2300,540,640);bez([540,640],[540,560],[560,540],[620,530]);seg(620,530,660,530,4);bez([660,530],[720,520],[740,500],[740,420]);seg(740,420,740,-760);
 const L=[0];for(let i=1;i<pts.length;i++)L.push(L[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));return {pts,L}}
const PATH=buildPath();
function lenAtY(y){for(let i=0;i<PATH.pts.length;i++)if(PATH.pts[i][1]<=y)return PATH.L[i];return PATH.L[PATH.L.length-1]}
const LEN_NODE1=lenAtY(900),LEN_BEND=lenAtY(640),LEN_AFTER=lenAtY(420),LEN_N3=lenAtY(-100),LEN_END=PATH.L[PATH.L.length-1];
function headLen(t){
 if(t<10.62)return lenAtY(1000);
 if(t<11.32)return mix(lenAtY(1000),LEN_BEND,eo(lin(t,10.62,11.32)));
 if(t<12.0)return mix(LEN_BEND,LEN_AFTER+120,eio(lin(t,11.38,11.9)));
 if(t<12.85)return mix(LEN_AFTER+120,LEN_N3,eio(lin(t,12.04,12.5)));
 return mix(LEN_N3,LEN_END,eio(lin(t,12.88,13.15)))}
function ptAt(len){const L=PATH.L;let i=1;while(i<L.length-1&&L[i]<len)i++;const p=cl((len-L[i-1])/(L[i]-L[i-1]||1));return [mix(PATH.pts[i-1][0],PATH.pts[i][0],p),mix(PATH.pts[i-1][1],PATH.pts[i][1],p)]}
function camYAt(t){const h=ptAt(headLen(t));return h[1]-1000}
function drawS4(t){
 bg();
 if(t<10.62){// red full narrows to a line
  const p=eio(lin(t,10.45,10.62));const w=mix(W*1.2,14,p);const top=mix(-50,1000,p);
  ctx.fillStyle=RED;ctx.fillRect(CX-w/2,top,w,H-top+50);return}
 // camera follows head with slight lag (smooth)
 const cy=mix(camYAt(t),camYAt(Math.max(10.62,t-.12)),.5);
 const cx=mix(0,-60,eio(lin(t,11.4,12.0)));
 ctx.save();ctx.translate(-cx,-cy);
 // bank dashed straight line
 const bk=lin(t,11.36,11.7);if(bk>0){ctx.save();ctx.strokeStyle='rgba(255,255,255,.22)';ctx.lineWidth=4;ctx.setLineDash([12,16]);ctx.beginPath();ctx.moveTo(540,640);ctx.lineTo(540,mix(640,-760,bk));ctx.stroke();ctx.restore();
  ctx.fillStyle='rgba(255,255,255,.4)';ctx.font=`400 30px ${F}`;ctx.textAlign='right';ctx.globalAlpha=bk;ctx.fillText('הצעת הבנק',515,mix(640,-100,bk));ctx.globalAlpha=1}
 // red path up to head
 const hl=headLen(t);ctx.strokeStyle=RED;ctx.lineWidth=14;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();
 let i=0;ctx.moveTo(...PATH.pts[0]);while(i<PATH.pts.length&&PATH.L[i]<=hl){ctx.lineTo(...PATH.pts[i]);i++}const hp=ptAt(hl);ctx.lineTo(...hp);ctx.stroke();
 // nodes
 const node=(len,tm,label,end)=>{const q=lin(t,tm,tm+.18);if(q<=0)return;const p=ptAt(len);ctx.save();ctx.translate(p[0],p[1]);const sc=mix(1.8,1,eo(q));ctx.scale(sc,sc);
  if(end){ctx.fillStyle=RED;ctx.beginPath();ctx.arc(0,0,30,0,7);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(-13,0);ctx.lineTo(-3,10);ctx.lineTo(15,-10);ctx.stroke()}
  else{ctx.fillStyle='#fff';ctx.fillRect(-15,-15,30,30)}ctx.restore();
  ctx.globalAlpha=q;ctx.fillStyle='#fff';ctx.font=`700 40px ${F}`;ctx.textAlign='right';ctx.fillText(label,p[0]-46,p[1]+14);ctx.globalAlpha=1};
 node(LEN_NODE1,10.7,'ניתוח');node(LEN_BEND+40,11.4,'משא ומתן');node(LEN_N3,12.1,'ליווי');node(LEN_END,12.95,'חתימה',1);
 ctx.restore();
}

// ============ S5 label card + door (13.35–16.35)
const CW=640,CH=900;const STRIPE_Y=640; // card-relative
let BARS=[];{let x=0;for(let i=0;i<70;i++){const w=[3,6,2,8,3,4,2][(i*5)%7];BARS.push([x,w]);x+=w+4+(i%3)}}
function drawCard(t){
 // card drawn with top-left at (0,0)
 ctx.fillStyle='#F3F4F8';ctx.fillRect(0,0,CW,CH);
 ctx.fillStyle='#181842';ctx.textAlign='right';ctx.direction='rtl';
 const ap=(a)=>lin(t,a,a+.2);
 ctx.globalAlpha=ap(13.8);ctx.font=`700 30px ${F}`;ctx.fillText('איציק דייטש',CW-40,64);
 ctx.font=`400 22px ${F}`;ctx.fillStyle='#55577A';ctx.textAlign='left';ctx.direction='ltr';ctx.fillText('FILE / 0536',40,64);
 ctx.fillStyle='#E1E2EB';ctx.fillRect(40,90,CW-80,2);
 ctx.direction='rtl';ctx.textAlign='right';ctx.fillStyle='#55577A';ctx.font=`400 26px ${F}`;ctx.globalAlpha=ap(13.9);ctx.fillText('החזר חודשי · הצעת הבנק',CW-40,140);
 // 6,240
 ctx.globalAlpha=ap(13.95);ctx.font=`300 150px ${F}`;ctx.fillStyle=t>14.3?'#A6A7C2':'#181842';ctx.fillText('6,240',CW-40,290);
 const st=eo(lin(t,14.1,14.35));if(st>0){ctx.fillStyle=RED;ctx.fillRect(CW-40-400*st,218,400*st,12)}
 // arrow
 ctx.globalAlpha=ap(14.0);ctx.strokeStyle='#181842';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(56,170);ctx.lineTo(56,530);ctx.moveTo(44,515);ctx.lineTo(56,532);ctx.lineTo(68,515);ctx.stroke();
 ctx.fillStyle='#55577A';ctx.font=`400 26px ${F}`;ctx.globalAlpha=ap(14.7);ctx.fillText('החזר חודשי · אחרי ליווי',CW-40,360);
 // 5,610 outline then fill
 ctx.globalAlpha=ap(14.7);ctx.font=`700 150px ${F}`;
 const nf=lin(t,15.24,15.45);ctx.lineWidth=2;ctx.strokeStyle='#B5B6CC';ctx.strokeText('5,610',CW-40,510);
 if(nf>0){ctx.save();ctx.beginPath();ctx.rect(CW-40-460*nf,370,460*nf,170);ctx.clip();ctx.fillStyle='#181842';ctx.fillText('5,610',CW-40,510);ctx.restore()}
 ctx.globalAlpha=1;
 // stripe
 ctx.fillStyle=RED;ctx.fillRect(40,STRIPE_Y-28,CW-80,56);
 const sp=lin(t,15.4,15.6);if(sp>0){ctx.globalAlpha=sp;ctx.fillStyle='#fff';ctx.font=`700 28px ${F}`;ctx.fillText('₪630 פחות בכל חודש',CW-62,STRIPE_Y+10);ctx.globalAlpha=1}
 // barcode
 const bp=lin(t,14.0,14.5);ctx.fillStyle='#181842';BARS.forEach(([x,w],i)=>{if(i/BARS.length<bp&&x+w<CW-80)ctx.fillRect(40+x,720,w,90)});
 ctx.globalAlpha=ap(14.4);ctx.fillStyle='#8F90A8';ctx.font=`400 20px ${F}`;ctx.fillText('* המספרים להמחשה בלבד',CW-40,858);ctx.globalAlpha=1;
}
const DOOR={x:365,y:670};
function drawS5(t){
 bg();
 if(t<13.62){// twist: vertical line -> horizontal bar
  const p=eio(lin(t,13.35,13.62));ctx.save();ctx.translate(CX,CY);ctx.rotate(mix(90,0,p)*D);ctx.fillStyle=RED;const L=mix(1100,CW-80,p);ctx.fillRect(-L/2,-7,L,14);ctx.restore();return}
