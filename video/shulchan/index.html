</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>window.PHOTO=window.PHOTO||'img/itzik.jpg'</script>
<div id="cap"></div>
<script>
const W=1080,H=1920,CX=540,CY=1000;
const RED='#D9353B',BG='#0A0A1C';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lin=(t,a,b)=>cl((t-a)/(b-a));
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eo=x=>1-Math.pow(1-x,3);
const ei=x=>x*x*x;
const mix=(a,b,p)=>a+(b-a)*p;
const emix=(a,b,p)=>a*Math.pow(b/a,p); // exponential zoom
const D=Math.PI/180;
const hash=(i,j)=>{const x=Math.sin(i*127.1+j*311.7)*43758.5453;return x-Math.floor(x)};
const F="'IBM Plex Sans Hebrew'";
function img(src){const i=new Image();i.src=src;return i}
const IA=img('img/a.jpg'),IB=img('img/b.jpg'),IC=img('img/c.jpg'),LOGO=img('img/logo-light.png');
const IP=window.PHOTO?img(window.PHOTO):null;

// ============ captions (DOM, word-timed, no exclamation marks)
const CAPS=[
 {a:.2,b:2.2,ws:[['בבנק',.2],['יש',.74],['מישהו',1.0],['שדואג',1.44],['לבנק.',1.82]]},
 {a:2.24,b:3.22,ws:[['ומי',2.28],['דואג',2.5],['לכם?',2.72,'k']]},
 {a:3.28,b:5.46,ws:[['משכנתא',3.3],['ל-30',3.74],['שנה,',4.0],['על',4.46],['סמך',4.56],['הצעה',4.82],['אחת?',5.16,'k']]},
 {a:5.5,b:7.5,ws:[['זה',5.52],['כמו',5.68],['לסובב',5.84],['רולטה',6.18,'k'],['ולקוות',6.6],['לטוב.',7.04]]},
 {a:7.6,b:8.62,ws:[['אני',7.65],['איציק',7.81,'b'],['דייטש.',8.07,'b']]},
 {a:8.66,b:10.5,ws:[['יושב',8.71],['בצד',9.01],['שלכם',9.39,'k'],['של',9.81],['השולחן.',10.01]]},
 {a:10.62,b:11.34,ws:[['מנתח.',10.68]]},
 {a:11.34,b:12.0,ws:[['מתמקח.',11.38]]},
 {a:12.0,b:13.4,ws:[['ומלווה',12.04],['עד',12.58],['החתימה.',12.88,'k']]},
 {a:13.45,b:14.66,ws:[['הבנק',13.5],['תמיד',13.82],['מרוויח.',14.08]]},
 {a:14.66,b:16.0,ws:[['הפעם,',14.7],['גם',15.24,'k'],['אתם.',15.4,'k']]},
 {a:16.05,b:17.7,ws:[['שלחו',16.1],['לי',16.44],['"שולחן"',16.58,'k'],['בוואטסאפ',17.2]]},
 {a:17.7,b:18.95,ws:[['ואני',17.74],['חוזר',17.98],['אליכם',18.26],['עוד',18.64],['היום.',18.88]]},
];
const capEl=document.getElementById('cap');
CAPS.forEach(c=>{c.el=document.createElement('div');c.el.style.position='absolute';c.el.style.right='0';c.el.style.top='0';c.el.style.width='820px';
 c.W=c.ws.map(([s,t,k])=>{const sp=document.createElement('span');sp.className='w'+(k?' '+k:'');sp.textContent=s;c.el.appendChild(sp);return {sp,t}});capEl.appendChild(c.el)});
const COVER=document.createElement('div');COVER.innerHTML='<div style="font-size:46px;color:rgba(255,255,255,.7);margin-bottom:16px">בבנק יש מישהו שדואג לבנק.</div><div style="font-size:132px;font-weight:700;line-height:1.02">ומי דואג<br><span style="color:#E0393F">לכם?</span></div>';
COVER.style.cssText='position:absolute;right:0;top:0;width:820px';capEl.appendChild(COVER);
function drawCaps(t){
 const cover=t<0.12;COVER.style.display=cover?'block':'none';
 CAPS.forEach(c=>{const on=!cover&&t>=c.a-0.05&&t<c.b;c.el.style.display=on?'block':'none';if(!on)return;
  const out=lin(t,c.b-.1,c.b);c.el.style.opacity=1-out;
  c.W.forEach(w=>{const q=eo(lin(t,w.t-.03,w.t+.14));w.sp.style.opacity=q;w.sp.style.transform=`translateY(${(1-q)*14}px)`});});
}

// ============ generic helpers
function brackets(x,y,w,h,a=1,lw=5){if(a<=0)return;ctx.save();ctx.globalAlpha=a;ctx.strokeStyle='#fff';ctx.lineWidth=lw;ctx.lineCap='square';
 const L=Math.min(w,h)*.24;
 [[x,y,1,1],[x+w,y,-1,1],[x,y+h,1,-1],[x+w,y+h,-1,-1]].forEach(([px,py,sx,sy])=>{ctx.beginPath();ctx.moveTo(px,py+sy*L);ctx.lineTo(px,py);ctx.lineTo(px+sx*L,py);ctx.stroke()});ctx.restore()}
function bg(){ctx.fillStyle=BG;ctx.fillRect(0,0,W,H);const g=ctx.createRadialGradient(CX,CY,100,CX,CY,1200);g.addColorStop(0,'rgba(40,40,100,.35)');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
// photo-space camera: point (fx,fy) of a photo lands on screen (CX,CY) at scale s, rotation r
function camApply(fx,fy,s,r){ctx.translate(CX,CY);ctx.rotate(r*D);ctx.scale(s,s);ctx.translate(-fx,-fy)}

// ============ S1 grid + S2 photo A (shared photo-space; target roof = cell 0,0 at (378,640))
const TX=378,TY=640,PX=109,PY=195,RW=82,RH=123;
const SCAN=[[4,-3],[-3,2],[2,4],[-4,-1],[3,1]];
function roul(){const pts=[];let t=5.55,dt=.3;let k=0;while(t<6.9){pts.push([t,[Math.round((hash(k,3)-.5)*8),Math.round((hash(k,7)-.5)*6)]]);t+=dt;dt*=.82;k++}pts.push([6.92,[0,0]]);return pts}
const ROUL=roul();
const LP=172,DSZ=98,DRAD=20,HC=LP/2;
const BEAT=60/140;
const beatEnv=t=>Math.pow(1-((t%BEAT)/BEAT),3);
const lpos=(i,j)=>[TX+i*LP+(((j%2)+2)%2)*LP/2,TY+j*LP/2];
const uvpos=(u,v)=>[TX+u*HC,TY+v*HC];
const TILE=new Path2D();TILE.roundRect(-DSZ/2,-DSZ/2,DSZ,DSZ,DRAD);
const BANKP=(()=>{const p=new Path2D();p.moveTo(-26,-8);p.lineTo(0,-24);p.lineTo(26,-8);p.closePath();[-17,-6,6,17].forEach(x=>{p.moveTo(x,-3);p.lineTo(x,15)});p.moveTo(-26,20);p.lineTo(26,20);return p})();
// 5x7 glyphs
const GL={'?':['.###.','#...#','....#','...#.','..#..','.....','..#..'],'3':['####.','....#','....#','.###.','....#','....#','####.'],'0':['.###.','#...#','#...#','#...#','#...#','#...#','.###.']};
function inQ(u,v){const gx=Math.floor((u+7.5)/3),gy=Math.floor((v+10.5)/3);if(gx<0||gx>4||gy<0||gy>6)return false;return GL['?'][gy][gx]=='#'}
function in30(u,v){const gx=Math.floor((u+16.5)/3),gy=Math.floor((v+10.5)/3);if(gx<0||gx>10||gy<0||gy>6||gx==5)return false;return gx<5?GL['3'][gy][gx]=='#':GL['0'][gy][gx-6]=='#'}
const BANK_UV=[-6,-4];
// roulette ring (tiles around centre)
const RING=[];for(let v=-6;v<=6;v++)for(let u=-6;u<=6;u++){if((u+v)%2)continue;const d=Math.hypot(u,v*1);if(d>3.6&&d<4.7)RING.push([u,v,Math.atan2(v,u)])}RING.sort((a,b)=>a[2]-b[2]);
const ROUL_T0=5.56,ROUL_T1=6.9;
function roulIdx(t){const p=eo(lin(t,ROUL_T0,ROUL_T1));const turns=3+5/RING.length;return Math.floor(p*turns*RING.length)%RING.length}
// camera keyframes for S1
const CK=[[0,.75,TX+LP*.8,TY+LP*1.0,-6],[.12,.75,TX+LP*.8,TY+LP*1.0,-6],[1.0,.62,TX-LP*1.2,TY-LP*.8,-14],[2.2,.82,TX-6*HC,TY-4*HC,-10],[2.62,.42,TX,TY,-3],[3.25,.45,TX,TY,-2],[3.75,.27,TX,TY,0],[4.45,.28,TX,TY,1],[5.2,.95,TX,TY,-2],[5.5,1.0,TX,TY,-2],[6.95,1.15,TX,TY,-1],[7.45,1.75,TX,TY,0]];
function camS1(t){
 if(t>=7.45){let s,fx=TX,fy=TY,r;
  if(t<7.85){const p=lin(t,7.45,7.85);s=mix(1.75,2.4,eio(p));r=mix(0,7,eio(p))}
  else{const p=lin(t,7.85,8.1);s=emix(2.4,40,ei(p));r=7+p*6}
  return {fx,fy,s,r}}
 let k=0;while(k<CK.length-2&&t>=CK[k+1][0])k++;
 const a=CK[k],b=CK[k+1];const p=eio(lin(t,a[0],b[0]));
 let s=emix(a[1],b[1],p),fx=mix(a[2],b[2],p),fy=mix(a[3],b[3],p),r=mix(a[4],b[4],p);
 // roulette spin (two full turns, decelerating)
 r+=-720*eo(lin(t,5.52,7.3));
 // beat breathing
 s*=1+beatEnv(t)*.006;
 return {fx,fy,s,r}}
function tileState(u,v,t){
 // returns {flip(0..1 extra scaleX factor), col:[r,g,b], icon:null|'bank'|'house'}
 const h=hash(u*7+3,v*13+1);let g=44+h*24;let col=[g,g,g+12];let sx=1,icon=null;
 const d=Math.hypot(u,v);
 // flip wave at start
 if(t>=.12&&t<1.4){const f=lin(t,.15+d*.018,.15+d*.018+.32);if(f>0&&f<1){sx=Math.abs(Math.cos(f*Math.PI));const lift=Math.sin(f*Math.PI)*40;col=[g+lift,g+lift,g+12+lift]}}
 // bank tiles
 const isB=(u==BANK_UV[0]&&v==BANK_UV[1]);
 const wave=!isB&&h<.13&&d<16&&d>2;
 const bOn=isB?lin(t,1.0,1.2):wave?lin(t,1.82+d*.012,1.98+d*.012):0;
 const bOff=lin(t,2.2+d*.01,2.36+d*.01);
 if(bOn>0&&bOff<1){const ph=bOn<1?bOn:bOff;sx*=Math.abs(Math.cos(ph*Math.PI/2*(bOn<1?1:1)));
  const show=(bOn>=.5&&bOff<.5);if(show){icon='bank';col=isB?[70,72,150]:[52,54,110]}}
 // "?"
 const q=inQ(u,v);const q30=in30(u,v);
 if(q&&t>=2.28&&t<3.75){const on=lin(t,2.28+(v+10.5)/21*.32,2.36+(v+10.5)/21*.32);const red=lin(t,2.72+d*.01,2.8+d*.01);
  const off=q30?0:lin(t,3.3+(u+16.5)/33*.4,3.42+(u+16.5)/33*.4);
  const c=red>0?[mix(233,217,red),mix(234,53,red),mix(246,59,red)]:[233,234,246];
  const k=on*(1-off);col=[mix(col[0],c[0],k),mix(col[1],c[1],k),mix(col[2],c[2],k)];if(off>0&&off<1)sx*=Math.abs(Math.cos(off*Math.PI))}
 // "30"
 if(q30&&t>=3.3&&t<5.2){const st=3.3+(u+16.5)/33*.4;const on=lin(t,st,st+.14);const fl=lin(t,st,st+.2);if(fl>0&&fl<1&&!q)sx*=Math.abs(Math.cos(fl*Math.PI));
  const prevRed=q?1:0;const c=[233,234,246];
  const off=lin(t,4.46+(16-d)*.022,4.58+(16-d)*.022);
  const base=prevRed?[217,53,59]:col;const k=on;let cc=[mix(base[0],c[0],k),mix(base[1],c[1],k),mix(base[2],c[2],k)];
  if(t>=3.74&&t<3.95){const pl=Math.sin(lin(t,3.74,3.95)*Math.PI)*30;cc=cc.map(x=>x+pl)}
  if(t>=3.95&&t<4.46){const sw=Math.max(0,Math.sin((u+16.5)/33*Math.PI*1.5-(t-3.95)*9));cc=[mix(cc[0],217,sw*.8),mix(cc[1],53,sw*.8),mix(cc[2],59,sw*.8)]}
  col=[mix(cc[0],g,off),mix(cc[1],g,off),mix(cc[2],g+12,off)]}
 // dim the field while the glyphs show / one offer
 const dim=(t>2.3&&t<5.5)&&!(q&&t<3.5)&&!(q30&&t>3.3&&t<4.6)?.62:1;
 if(!(u==0&&v==0))col=col.map(x=>x*dim);
 // the one offer
 if(u==0&&v==0){const one=lin(t,5.16,5.24);if(one>0&&t<6.95){col=[mix(col[0],245,one),mix(col[1],245,one),mix(col[2],252,one)]}
  if(t>=5.6&&t<6.9)col=[120,120,140];}
 // roulette chase
 if(t>=ROUL_T0&&t<6.92){const ri=roulIdx(t);RING.forEach(([ru,rv],k)=>{if(ru==u&&rv==v){const back=(ri-k+RING.length)%RING.length;const a=back==0?1:back==1?.45:back==2?.2:0;col=[mix(col[0],245,a),mix(col[1],245,a),mix(col[2],252,a)]}})}
 return {sx,col,icon}}
function drawS1(t){
 const {fx,fy,s,r}=camS1(t);
 bg();ctx.save();camApply(fx,fy,s,r);const camM=ctx.getTransform();
 const photoA=lin(t,7.28,7.48);
 const gridA=1-lin(t,7.08,7.32);
 const be=beatEnv(t);
 if(gridA>0){
  ctx.globalAlpha=gridA;
  const span=Math.ceil(1150/(s*HC))+2;
  const cu=Math.round((fx-TX)/HC),cv=Math.round((fy-TY)/HC);
  for(let v=cv-span;v<=cv+span;v++)for(let u=cu-span;u<=cu+span;u++){
   if((u+v)%2)continue;if(u==0&&v==0&&t>=6.92)continue;
   const st=tileState(u,v,t);const [x,y]=uvpos(u,v);
   ctx.setTransform(camM);ctx.translate(x,y);ctx.scale(st.sx,1);ctx.rotate(45*D);
   const c=st.col.map(z=>Math.round(Math.min(255,z+be*5)));ctx.fillStyle=`rgb(${c[0]},${c[1]},${c[2]})`;ctx.fill(TILE);
   if(st.icon=='bank'){ctx.rotate(-45*D);ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=5;ctx.lineJoin='round';ctx.stroke(BANKP)}
  }
  ctx.setTransform(camM);ctx.globalAlpha=1;
 }
 // the chosen one: red logo diamond, morphs into the roof
 const red=t<0.12?1:lin(t,6.92,7.05);
 if(red>0){const mo=eio(lin(t,7.05,7.35));
  ctx.save();ctx.translate(TX,TY);const pop=t<0.12?1:1+.35*Math.sin(Math.PI*lin(t,6.92,7.15));ctx.scale(pop,pop);
  const w=mix(DSZ,RW,mo),hh=mix(DSZ,RH,mo),rr=mix(DRAD,3,mo);ctx.rotate(mix(45,0,mo)*D);
  ctx.fillStyle=`rgb(${mix(245,217,red)},${mix(245,53,red)},${mix(252,59,red)})`;ctx.shadowColor='rgba(217,53,59,.8)';ctx.shadowBlur=50*red*(1-mo);
  ctx.beginPath();ctx.roundRect(-w/2,-hh/2,w,hh,rr);ctx.fill();ctx.shadowBlur=0;
  if(mo<1){ctx.rotate(-mix(45,0,mo)*D);ctx.globalAlpha=red*(1-mo);ctx.strokeStyle='#fff';ctx.lineWidth=7;ctx.lineCap='round';ctx.lineJoin='round';ctx.scale(.42,.42);ctx.stroke(HPATH);ctx.globalAlpha=1}
  ctx.restore();
  // shock ring on landing
  const sr=lin(t,6.92,7.3);if(sr>0&&sr<1){ctx.save();ctx.strokeStyle=`rgba(217,53,59,${1-sr})`;ctx.lineWidth=6/s;ctx.beginPath();ctx.arc(TX,TY,DSZ*(.8+sr*3),0,7);ctx.stroke();ctx.restore()}}
 // flash ring on the one offer
 const fr=lin(t,5.16,5.5);if(fr>0&&fr<1){ctx.save();ctx.strokeStyle=`rgba(255,255,255,${1-fr})`;ctx.lineWidth=5/s;ctx.beginPath();ctx.arc(TX,TY,DSZ*(.8+fr*2.5),0,7);ctx.stroke();ctx.restore()}
 if(photoA>0&&IA.complete){ctx.globalAlpha=photoA;ctx.drawImage(IA,0,0);ctx.globalAlpha=1}
 ctx.restore();
 // brackets
 let bp=null,bt=0;
 if(t<0.12)bp=[0,0];
 else if(t<1.0){const k=Math.floor((t-.12)/BEAT);bp=[(Math.round((hash(k,5)-.5)*10))*2,(Math.round((hash(k,9)-.5)*8))*2];bt=.12+k*BEAT}
 else if(t<2.25){bp=BANK_UV;bt=1.0}
 else if(t>=5.16&&t<5.6){bp=[0,0];bt=5.16}
 else if(t>=5.6&&t<6.92){const ri=roulIdx(t);bp=[RING[ri][0],RING[ri][1]];bt=t}
 else if(t>=6.92&&t<7.8){bp=[0,0];bt=6.92}
 if(bp){const [bx,by]=uvpos(bp[0],bp[1]);const m=new DOMMatrix().translate(CX,CY).rotate(r).scale(s).translate(-fx,-fy);const pt=m.transformPoint(new DOMPoint(bx,by));
  const snap=eo(lin(t,bt,bt+.16));const mo=eio(lin(t,7.05,7.35));const pad=mix(1.9,1.25,snap);
  const bw=mix(DSZ*1.42,RW,mo)*s*pad,bh=mix(DSZ*1.42,RH,mo)*s*pad;const ba=t<7.8?1:1-lin(t,7.8,7.92);
  ctx.save();ctx.translate(pt.x,pt.y);ctx.rotate(r*D);brackets(-bw/2,-bh/2,bw,bh,ba,Math.max(3,Math.min(6,s*6)));ctx.restore()}
}

// ============ S3 portrait (8.1–9.0) -> zoom out to table (9.0–10.45)
const FOLD={x:375,y:981,w:180,h:250};
function drawPortrait(x,y,w,h){
 ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();
 if(IP&&IP.complete&&IP.naturalWidth){const sc=Math.max(w/IP.naturalWidth,h/IP.naturalHeight)*1.35;const iw=IP.naturalWidth*sc,ih=IP.naturalHeight*sc;const fx=560*sc,fy=520*sc;ctx.filter='grayscale(1) contrast(1.1) brightness(.97)';ctx.drawImage(IP,x+w/2-fx,y+h*.36-fy,iw,ih);ctx.filter='none'}
 else{const g=ctx.createLinearGradient(x,y,x,y+h);g.addColorStop(0,'#3A3B60');g.addColorStop(1,'#1E1F3E');ctx.fillStyle=g;ctx.fillRect(x,y,w,h);
  ctx.fillStyle='#5A5C82';ctx.beginPath();ctx.arc(x+w/2,y+h*.38,w*.17,0,7);ctx.fill();ctx.beginPath();ctx.ellipse(x+w/2,y+h*.95,w*.36,h*.3,0,Math.PI,0);ctx.fill()}
 ctx.restore()}
function drawS3(t){
 bg();
 const FW=760,FH=1040;
 if(t<9.0){
  // red field; a portrait window opens from the centre and keeps spinning out of the zoom
  const p=eo(lin(t,8.1,8.42));const sc=mix(.05,1,p)*(1+lin(t,8.42,9.0)*.05);const rot=mix(13,0,p)+Math.sin(t*2)*.6;
  ctx.fillStyle=RED;ctx.fillRect(0,0,W,H);
  ctx.save();ctx.translate(CX,CY);ctx.rotate(rot*D);ctx.scale(sc,sc);
  drawPortrait(-FW/2,-FH/2,FW,FH);
  // red outside the frame fades to the dark bg as the frame settles, leaving a red border
  ctx.restore();
  const bgA=lin(t,8.3,8.5);if(bgA>0){ctx.save();ctx.globalAlpha=bgA;ctx.translate(CX,CY);ctx.rotate(rot*D);ctx.scale(sc,sc);
   ctx.beginPath();ctx.rect(-4000,-4000,8000,8000);ctx.rect(-FW/2-14,-FH/2-14,FW+28,FH+28);ctx.fillStyle=BG;ctx.fill('evenodd');ctx.restore()}
  const lk=eo(lin(t,8.42,8.58));ctx.save();ctx.translate(CX,CY);ctx.rotate(rot*D);ctx.scale(sc,sc);brackets(-FW/2+205-((1-lk)*40),-FH/2+181-((1-lk)*40),302+(1-lk)*80,386+(1-lk)*80,lk,5);ctx.restore();
  return}
 // photo B camera: frame becomes the folder, keep pulling out, then push back in
 const sc0=(FW/FOLD.w)*1.05;let s,fx,fy,r;
 if(t<9.7){const p=eio(lin(t,9.0,9.7));s=emix(sc0,1.75,p);fx=mix(FOLD.x,376,p);fy=mix(FOLD.y,850,p);r=mix(0,-5,p)}
 else if(t<10.0){const p=lin(t,9.7,10.0);s=mix(1.75,1.85,p);fx=376;fy=850;r=mix(-5,-6,p)}
 else{const p=lin(t,10.0,10.45);s=emix(1.85,14,ei(p));fx=mix(376,FOLD.x,eio(p));fy=mix(850,FOLD.y,eio(p));r=mix(-6,0,eio(p))}
 ctx.save();camApply(fx,fy,s,r);if(IB.complete)ctx.drawImage(IB,0,0);
